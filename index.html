<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Hub | Adventure Pinboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="container">
            <p class="eyebrow">Family Hub</p>
            <h1>📌 Adventure Pinboard</h1>
            <p class="subtitle">Save where to go, when to go, who’s in, and what to do there.</p>
        </div>
    </header>

    <main class="main container">
        <details class="add-pin" open>
            <summary>＋ Add a pin</summary>
            <form id="pin-form" class="pin-form">
                <label class="form-title">Activity or place<input name="title" required maxlength="120" placeholder="e.g. Goblin Valley weekend"></label>
                <label>Where<input name="where" maxlength="240" placeholder="Place, address, or route"></label>
                <label>When<input name="when" maxlength="160" placeholder="Season, dates, or best time"></label>
                <label>Who<input name="who" maxlength="200" placeholder="People who are interested"></label>
                <label class="form-wide">What to do there<textarea name="what" rows="3" maxlength="1200" placeholder="Ideas, plans, links, or things to remember"></textarea></label>
                <button class="primary-btn" type="submit">Add to the board</button>
            </form>
        </details>

        <div class="board-heading">
            <div>
                <h2>Adventure ideas</h2>
                <p id="pin-count" class="pin-count">Loading pins…</p>
            </div>
            <p class="plus-hint">Tap <strong>+1</strong> to show interest.</p>
        </div>
        <p id="app-message" class="app-message" role="status" aria-live="polite"></p>
        <section id="pin-board" class="pin-board" aria-label="Adventure pins"></section>
    </main>

    <footer class="footer">
        <div class="container">
            <p>Local prototype · Pins and +1 counts are stored in SQLite.</p>
        </div>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
